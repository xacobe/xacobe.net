'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/11.x/core/modules/sdc/src/metadata.schema.json'
name: Icon
status: stable
description: Bootstrap Icon SVG inline. Optionally wrapped in a link.
props:
  type: object
  required: [icon_name]
  properties:
    icon_name:
      type: string
      title: Name
      description: Bootstrap Icon file name (e.g. "star-fill", "arrow-right").
    icon_svg_size:
      type: string
      title: Size
      description: Width and height in pixels, without unit (e.g. "16", "24").
    icon_svg_fill:
      type: string
      title: Fill color
      description: CSS color value. Defaults to currentColor.
    icon_svg_stroke:
      type: string
      title: Stroke color
      description: CSS color value for stroke.
    icon_svg_stroke_width:
      type: string
      title: Stroke width
      description: SVG stroke-width value.
    icon_svg_viewbox:
      type: string
      title: viewBox
      description: "Override when the icon is not a standard Bootstrap Icon. Default: '0 0 16 16'."
    icon_svg_classes:
      type: string
      title: SVG classes
      description: Extra classes on the SVG element (e.g. swap-on, swap-off).
