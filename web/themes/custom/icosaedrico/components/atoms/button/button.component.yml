$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/modules/sdc/src/metadata.schema.json
name: Button
description: JavaScript enhanced button that tracks the number of times a user clicked it.
libraryOverrides:
  dependencies:
    - core/once
props:
  type: object
  required: [button_tag]
  properties:
    button_text:
      type: string
      title: Title
      description: The title for the button
    button_href:
      type: string
      title: Link
      description: The link for the button
    button_target:
      type: string
      title: Target
      description: The target for the button
    button_tag:
      type: string
      title: Tag
      description: The HTML tag to use
      default: "a"
      examples:
        - a
        - button
    button_color:
      type: string
      title: Color
      description: The color for the button
    button_icon:
      type: string
      title: Icon Type
    button_icon_size:
      type: string
      title: Icon Size
    button_outline:
      type: boolean
      title: Outline
      description: The button outlined
    button_glass:
      type: boolean
      title: Button glass
      description: Glass effect as background
    button_size:
      type: string
      title: Button size
      enum:
        - ""
        - block
        - lg
        - sm
        - xs
        - wide
    button_disable:
      type: string
      title: Button disable
      description: If the button is disable and how, with classes or attributes
      enum:
        - ""
        - class
        - attribute
    button_shape:
      type: string
      title: Button shape
      description: Geometrical shape of the button
      enum:
        - ""
        - square
        - circle
