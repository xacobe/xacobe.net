'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/11.x/core/modules/sdc/src/metadata.schema.json'
name: Tabs
status: experimental
props:
  type: object
  properties:
    tab_text:
      type: string
      title: Text in the tab
    tab_type:
      type: string
      title: Tab type
      enum:
        - ""
        - bordered
        - lifted
        - boxed
    tab_href:
      type: string
      title: Anchor for the tab
    tab_size:
      type: string
      title: Tab size
      enum:
        - ""
        - lg
        - sm
        - xs
    tab_icon:
      type: string
      title: Icon
    tab_classses:
      type: string
      title: Tab classes
slots:
  tab_content_primary:
      title: Tab content
      description: Content of the tab
  tab_content_secondary:
      title: Tab secondary content
      description: Second level of content if need it
