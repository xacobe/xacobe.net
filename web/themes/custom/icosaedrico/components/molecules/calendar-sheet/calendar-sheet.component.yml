'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/11.x/core/modules/sdc/src/metadata.schema.json'
name: Calendar sheet
status: stable
description: A calendar sheet as the office desktops
props:
  type: object
  properties:
    year:
      type: string
      title: Year
      examples: ["2024", "2025"]

    month:
      type: string
      title: Month
      examples: ["January", "March"]

    day_of_month:
      type: string
      title: Day of month
      examples: ["01", "15", "31"]

    day_of_week:
      type: string
      title: Day of week
      examples: ["Monday", "Friday"]