$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/modules/sdc/src/metadata.schema.json
name: Main navigation
status: stable
props:
  type: object
  properties:
    menu_level_0_classes:
      type: string
      title: Root menu classes
      description: "CSS classes for the top-level <ul>. Default: 'main-menu menu menu-horizontal px-1 uppercase'."
      examples:
        - 'main-menu menu menu-horizontal px-1 uppercase'
        - 'menu menu-horizontal px-4 text-xl'
