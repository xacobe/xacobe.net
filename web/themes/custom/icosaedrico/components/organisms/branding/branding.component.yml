$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/modules/sdc/src/metadata.schema.json
name: Branding
status: experimental
props:
  type: object
  properties:
    branding_layout:
      type: string
      title: Layout
      description: Direction of logo and text arrangement.
      enum:
        - horizontal
        - vertical
    branding_size:
      type: string
      title: Size
      description: Controls logo and title scale.
      enum:
        - sm
        - md
        - lg
        - xl
    branding_show_logo:
      type: boolean
      title: Show logo
      description: Whether to render the site logo image.
    branding_show_slogan:
      type: boolean
      title: Show slogan
      description: Whether to render the site slogan.
